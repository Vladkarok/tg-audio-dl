name: Update yt-dlp

on:
  schedule:
    # Every 4 hours. yt-dlp ships a fix and the bot is broken until we take it,
    # so the check is cheap (~15s, no-op unless the lock actually moves) and
    # waiting a whole day to notice is not.
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      ignore_cooldown:
        description: "Adopt the newest release even if younger than the cooldown"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  # Supply-chain cooldown: never adopt a release younger than this many days,
  # so a compromised upload is likely yanked before we ever lock it. One day
  # rather than three: a malicious upload is pulled within hours, while three
  # days of waiting was leaving the bot broken against YouTube changes that
  # yt-dlp had already fixed. A release is now adopted between 1d and 1d+4h
  # after publication. Manual dispatch with ignore_cooldown skips even that.
  YTDLP_COOLDOWN_DAYS: "1"

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # needed to read tags for version bump

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10
        with:
          version: "0.13.7"

      - name: Resolve cooldown-compliant yt-dlp version
        id: target
        env:
          IGNORE_COOLDOWN: ${{ github.event.inputs.ignore_cooldown }}
        run: |
          if [ "$IGNORE_COOLDOWN" = "true" ]; then
            echo "::warning::Supply-chain cooldown bypassed by manual dispatch"
            YTDLP_COOLDOWN_DAYS=0
            export YTDLP_COOLDOWN_DAYS
          fi
          curl -sf https://pypi.org/pypi/yt-dlp/json -o /tmp/ytdlp.json
          TARGET=$(python3 - <<'PY'
          import datetime
          import json
          import os

          cooldown = datetime.timedelta(days=int(os.environ["YTDLP_COOLDOWN_DAYS"]))
          now = datetime.datetime.now(datetime.timezone.utc)
          with open("/tmp/ytdlp.json") as f:
              data = json.load(f)

          best = None
          for version, files in data["releases"].items():
              if not files or any(f.get("yanked") for f in files):
                  continue
              # Stable releases only (yt-dlp uses YYYY.M.D); skip dev/rc builds.
              parts = version.split(".")
              if not all(p.isdigit() for p in parts):
                  continue
              uploaded = min(
                  datetime.datetime.fromisoformat(f["upload_time_iso_8601"])
                  for f in files
              )
              if now - uploaded < cooldown:
                  continue
              key = tuple(int(p) for p in parts)
              if best is None or key > best[0]:
                  best = (key, version)

          print(best[1] if best else "")
          PY
          )
          if [ -z "$TARGET" ]; then
            echo "::error::No cooldown-compliant yt-dlp release found on PyPI"
            exit 1
          fi
          echo "Cooldown-compliant target: $TARGET"
          echo "version=$TARGET" >> "$GITHUB_OUTPUT"

      # yt-dlp-ejs and deno need no --upgrade-package of their own: yt-dlp's
      # `default` and `pin-deno` extras pin them with ==, so the resolver moves
      # them whenever the new yt-dlp pins different versions. The test job's
      # tests/test_js_runtime.py fails the release if they ever drift apart.
      - name: Update yt-dlp
        run: uv lock --upgrade-package "yt-dlp==${{ steps.target.outputs.version }}"

      - name: Detect version change
        id: check
        run: |
          locked_ytdlp() {
            grep -A1 '^name = "yt-dlp"$' <<<"$1" | grep '^version' | cut -d'"' -f2
          }
          if git diff --quiet uv.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            OLD=$(locked_ytdlp "$(git show HEAD:uv.lock)")
            NEW=$(locked_ytdlp "$(cat uv.lock)")
            echo "changed=true"  >> "$GITHUB_OUTPUT"
            echo "old=${OLD}"    >> "$GITHUB_OUTPUT"
            echo "new=${NEW}"    >> "$GITHUB_OUTPUT"
          fi

      # Merging to master must not mean "deploy at the next yt-dlp release".
      # The updater tags (and so deploys) on its own only when everything since
      # the last tag is its own earlier bumps. Otherwise it still commits the
      # bump but leaves tagging to a person, who then ships the bump together
      # with the unreleased work they merged. Rules: scripts/release_decision.sh.
      - name: Decide whether to release unattended
        id: decide
        if: steps.check.outputs.changed == 'true'
        run: |
          OUT=$(scripts/release_decision.sh)
          echo "$OUT"
          echo "$OUT" >> "$GITHUB_OUTPUT"

      - name: Commit bump, tag if allowed, and push
        id: tag
        if: steps.check.outputs.changed == 'true'
        env:
          OLD: ${{ steps.check.outputs.old }}
          NEW: ${{ steps.check.outputs.new }}
          DECISION: ${{ steps.decide.outputs.decision }}
          NEW_TAG: ${{ steps.decide.outputs.next_tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: bump yt-dlp ${OLD} → ${NEW}"
          if [ "$DECISION" = "release" ]; then
            git tag "$NEW_TAG"
            # --atomic: never leave the tag pushed without the commit, or the
            # commit without the tag.
            git push --atomic origin HEAD:master "$NEW_TAG"
            echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          else
            git push origin HEAD:master
          fi

      - name: Summary
        if: steps.check.outputs.changed == 'true'
        env:
          OLD: ${{ steps.check.outputs.old }}
          NEW: ${{ steps.check.outputs.new }}
          DECISION: ${{ steps.decide.outputs.decision }}
          REASON: ${{ steps.decide.outputs.reason }}
          LAST_TAG: ${{ steps.decide.outputs.last_tag }}
          NEXT_TAG: ${{ steps.decide.outputs.next_tag }}
          NEW_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          {
            echo "## yt-dlp ${OLD} → ${NEW}"
            echo
            if [ "$DECISION" = "release" ]; then
              echo "Tagged **${NEW_TAG}**; the release job builds and deploys it."
            else
              echo "Bump committed to master but **not released**: ${REASON}."
              echo
              echo "Production stays on the old yt-dlp until someone tags master by hand."
              if [ -n "$LAST_TAG" ]; then
                echo "That tag also ships these commits since ${LAST_TAG}:"
                echo
                echo '```'
                git log --oneline --no-decorate "${LAST_TAG}..HEAD"
                echo '```'
                echo
                echo "To release: \`git pull && git tag ${NEXT_TAG} && git push origin ${NEXT_TAG}\`"
                echo "(or a higher version if the unreleased work deserves one)."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Fail on purpose, once: this run is the only one that sees the new
      # version (later runs find the lock unchanged and pass), and a failed
      # scheduled run is what GitHub emails about. A warning or a green run
      # would let a yt-dlp fix sit unreleased with nobody noticing.
      - name: Ask for a manual release
        if: steps.check.outputs.changed == 'true' && steps.decide.outputs.decision != 'release'
        env:
          REASON: ${{ steps.decide.outputs.reason }}
        run: |
          echo "::error title=Manual release needed::yt-dlp bump committed but not deployed: ${REASON}. Tag master by hand to release it (see the run summary)."
          exit 1

  # This push used GITHUB_TOKEN, so the tag will NOT trigger CI/CD on its own.
  # Call it explicitly, or the bumped yt-dlp never reaches production.
  # Runs only when the updater pushed a tag; a held bump leaves `tag` empty.
  release:
    needs: update
    if: needs.update.outputs.tag != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci.yml
    with:
      build_tag: ${{ needs.update.outputs.tag }}
