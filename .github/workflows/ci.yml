name: CI/CD

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. v1.2.3 or latest)"
        required: false
        default: "latest"
  # Called by update-yt-dlp.yml. A tag pushed by that workflow uses the default
  # GITHUB_TOKEN, and GitHub deliberately does not start workflow runs for such
  # pushes — so the `push: tags` trigger above never fires for it. Calling this
  # workflow directly is what gets the bumped image built and deployed.
  workflow_call:
    inputs:
      build_tag:
        description: "Git tag to check out, build, and deploy"
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Validate the tag being released, not the caller's ref, when this
          # workflow is called by update-yt-dlp.yml.
          ref: ${{ inputs.build_tag || github.ref }}

      # Test on the Python the image runs, read from the Dockerfile so a base
      # image bump is tested without a second edit. .python-version stays on
      # the local dev version. The pinned uv only knows a 3.15 alpha build, so
      # setup-python provides the interpreter and uv may not download one.
      - name: Read runtime Python version
        run: |
          PY="$(sed -n 's/^FROM python:\([0-9.]*\)-slim AS final$/\1/p' Dockerfile)"
          if [ -z "$PY" ]; then
            echo "::error::No 'FROM python:<version>-slim AS final' line in Dockerfile"
            exit 1
          fi
          echo "UV_PYTHON=${PY}" >> "$GITHUB_ENV"
          echo "UV_PYTHON_DOWNLOADS=never" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.UV_PYTHON }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10
        with:
          version: "0.10.10"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: |
          uv run python -VV
          uv run pytest tests/ -q --tb=short

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Validate the tag being released, not the caller's ref, when this
          # workflow is called by update-yt-dlp.yml.
          ref: ${{ inputs.build_tag || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10
        with:
          version: "0.10.10"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Type check
        run: uv run mypy src/

  # Catches a broken Dockerfile or base image on the PR instead of at release
  # time. Builds only: no registry login, no push, no secrets. Skipped for tags
  # and for workflow_call, where the build job below does the real build.
  build-check:
    name: Build image (no push)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          # Branch pushes write the cache so tag builds (which can read the
          # default branch's cache) start warm; PR builds only read it.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}

  build:
    name: Build and push image
    runs-on: ubuntu-latest
    # inputs.build_tag is null for every trigger except workflow_call, and
    # startsWith() casts null to '' — so this can only be true for a real tag.
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      || startsWith(inputs.build_tag, 'v')
    needs: [test, lint]
    permissions:
      contents: read
      packages: write  # push to GHCR
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.build_tag || github.ref }}

      - name: Set image vars
        id: vars
        env:
          BUILD_TAG: ${{ inputs.build_tag }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          TAG="${BUILD_TAG:-$GITHUB_REF_NAME}"
          BASE="ghcr.io/${OWNER}/youtube-download-bot"
          echo "REPO_OWNER_LC=${OWNER}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${BASE}:${TAG}" >> $GITHUB_ENV
          echo "IMAGE_LATEST=${BASE}:latest" >> $GITHUB_ENV
          echo "image_tag=${BASE}:${TAG}" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_LATEST }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: [self-hosted, Linux, X64, tg-audio-dl]
    # always() prevents GitHub from skipping deploy when build was skipped (workflow_dispatch path)
    if: |
      always() && (
        needs.build.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && needs.build.result == 'skipped')
      )
    needs: [build]
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # scripts/deploy.sh must come from the release being deployed.
          ref: ${{ inputs.build_tag || github.ref }}

      - name: Set image vars
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          BASE="ghcr.io/${OWNER}/youtube-download-bot"
          # Empty whenever the build job was skipped — i.e. the workflow_dispatch
          # "deploy an existing tag" path.
          IMAGE_TAG="${{ needs.build.outputs.image_tag }}"
          if [ -z "$IMAGE_TAG" ]; then
            IMAGE_TAG="${BASE}:${{ github.event.inputs.image_tag }}"
          fi
          echo "REPO_OWNER_LC=${OWNER}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

      - name: Deploy from runner
        env:
          GHCR_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ env.REPO_OWNER_LC }}
          GHCR_IMAGE: ${{ env.IMAGE_TAG }}
          DEPLOY_SSH_ALIAS: tg-audio-dl-vprojects
        run: scripts/deploy.sh
